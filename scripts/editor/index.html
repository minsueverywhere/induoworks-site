<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="editor-token" content="__TOKEN__"><title>Induohood 로컬 편집</title><link rel="stylesheet" href="/__editor/editor.css"><script type="module" src="/__editor/editor.js"></script></head>
<body><header><div><strong>Induohood 편집</strong><small>이 컴퓨터에서만 열리는 작업 공간</small></div><nav><button id="reload">다시 불러오기</button><button id="preview">미리보기 갱신</button><button id="save">저장</button><button id="deploy" class="primary">콘텐츠만 배포</button></nav></header>
<p id="status" role="status" aria-live="polite">목록을 불러오는 중…</p>
<main><section class="map"><div class="map-tools"><label><input id="arrange" type="checkbox" checked>장면 편집</label><label>도구 <select id="tool"><option value="move">물체 이동</option><option value="grass">잔디 타일</option><option value="path">길 타일</option><option value="water">물 타일</option><option value="tree">나무 추가</option><option value="tuft">풀 추가</option><option value="erase">장식 지우기</option></select></label><label><input id="grid" type="checkbox">격자</label><span>이동 도구: 물체를 드래그 · 빈 바닥: 시점 이동. 배치 도구: 클릭하거나 타일을 칠하세요.</span><a href="/ko/?content=embedded" target="_blank" rel="noopener">사이트 미리보기 ↗</a></div><iframe id="map" title="마을 장면을 편집하는 Induohood 미리보기"></iframe></section>
<aside><nav id="tabs" aria-label="편집할 항목"><button data-tab="world" aria-pressed="false">장면</button><button data-tab="workers" aria-pressed="true">업체</button><button data-tab="projects">작품</button><button data-tab="media">이미지</button><button data-tab="music">음악</button></nav><div class="picker"><select id="entry" aria-label="편집할 항목 선택"></select><button id="add">추가</button></div><form id="fields"></form></aside></main>
<details id="logs"><summary>배포 결과</summary><pre></pre></details>
<dialog id="discard"><p>저장하지 않은 변경을 버리고 저장본을 불러올까요?</p><button id="discard-cancel">계속 편집</button> <button id="discard-confirm">변경 버리기</button></dialog></body></html>
